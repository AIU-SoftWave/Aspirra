services:
  aspirra-db:
    image: postgres:16
    container_name: aspirra-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aspirra_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aspirra_password}
      POSTGRES_DB: ${POSTGRES_DB:-aspirra}
    ports:
      - "5432:5432"
    volumes:
      - aspirra_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - aspirra-network

  student-service:
    build:
      context: ./src/Services/StudentService
      dockerfile: Dockerfile
    container_name: aspirra-student-service
    ports:
      - "5011:8080"
    depends_on:
      aspirra-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: Host=aspirra-db;Port=5432;Database=${POSTGRES_DB:-aspirra};Username=${POSTGRES_USER:-aspirra_user};Password=${POSTGRES_PASSWORD:-aspirra_password}
    networks:
      - aspirra-network

  academic-service:
    build:
      context: ./src/Services/AcademicService
      dockerfile: Dockerfile
    container_name: aspirra-academic-service
    ports:
      - "5012:8080"
    depends_on:
      aspirra-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: Host=aspirra-db;Port=5432;Database=${POSTGRES_DB:-aspirra};Username=${POSTGRES_USER:-aspirra_user};Password=${POSTGRES_PASSWORD:-aspirra_password}
    networks:
      - aspirra-network

  course-service:
    build:
      context: ./src/Services/CourseService
      dockerfile: Dockerfile
    container_name: aspirra-course-service
    ports:
      - "5013:8080"
    depends_on:
      aspirra-db:
        condition: service_healthy
      assessment-service:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: Host=aspirra-db;Port=5432;Database=${POSTGRES_DB:-aspirra};Username=${POSTGRES_USER:-aspirra_user};Password=${POSTGRES_PASSWORD:-aspirra_password}
      Services__AssessmentService: http://assessment-service:8080
    networks:
      - aspirra-network

  assessment-service:
    build:
      context: ./src/Services/AssessmentService
      dockerfile: Dockerfile
    container_name: aspirra-assessment-service
    ports:
      - "5014:8080"
    depends_on:
      aspirra-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: Host=aspirra-db;Port=5432;Database=${POSTGRES_DB:-aspirra};Username=${POSTGRES_USER:-aspirra_user};Password=${POSTGRES_PASSWORD:-aspirra_password}
    networks:
      - aspirra-network

  goal-planner-service:
    build:
      context: ./src/Services/GoalPlannerService
      dockerfile: Dockerfile
    container_name: aspirra-goal-planner-service
    ports:
      - "5015:8080"
    depends_on:
      aspirra-db:
        condition: service_healthy
      academic-service:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: Host=aspirra-db;Port=5432;Database=${POSTGRES_DB:-aspirra};Username=${POSTGRES_USER:-aspirra_user};Password=${POSTGRES_PASSWORD:-aspirra_password}
      Services__AcademicService: http://academic-service:8080
    networks:
      - aspirra-network

  habit-service:
    build:
      context: ./src/Services/HabitService
      dockerfile: Dockerfile
    container_name: aspirra-habit-service
    ports:
      - "5016:8080"
    depends_on:
      aspirra-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: Host=aspirra-db;Port=5432;Database=${POSTGRES_DB:-aspirra};Username=${POSTGRES_USER:-aspirra_user};Password=${POSTGRES_PASSWORD:-aspirra_password}
    networks:
      - aspirra-network

  # Remaining containers (study-planner, scheduling, adaptation, career, skill,
  # portfolio, job-preparation, analytics, prediction, ai-coach, dashboard,
  # notification, study-group, administration) are added in their own sprints.

volumes:
  aspirra_db_data:

networks:
  aspirra-network:
    driver: bridge
