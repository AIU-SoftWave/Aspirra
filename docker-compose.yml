version: '3.8'

services:
  aspirra-db:
    image: postgres:16
    container_name: aspirra-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aspirra_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aspirra_password}
      POSTGRES_DB: ${POSTGRES_DB:-aspirra}
    ports:
      - "5432:5432"
    volumes:
      - aspirra_db_data:/var/lib/postgresql/data
    networks:
      - aspirra-network

  api-gateway:
    build:
      context: ./src/ApiGateway
      dockerfile: Dockerfile
    container_name: aspirra-api-gateway
    ports:
      - "5000:8080"
    depends_on:
      - aspirra-db
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
    networks:
      - aspirra-network

  student-service:
    build: { context: ./src/Services/StudentService, dockerfile: Dockerfile }
    container_name: aspirra-student-service
    ports: ["5011:8080"]
    depends_on: [aspirra-db]
    environment: [ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}]
    networks: [aspirra-network]

  academic-service:
    build: { context: ./src/Services/AcademicService, dockerfile: Dockerfile }
    container_name: aspirra-academic-service
    ports: ["5012:8080"]
    depends_on: [aspirra-db]
    environment: [ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}]
    networks: [aspirra-network]

  course-service:
    build: { context: ./src/Services/CourseService, dockerfile: Dockerfile }
    container_name: aspirra-course-service
    ports: ["5013:8080"]
    depends_on: [aspirra-db]
    environment: [ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}]
    networks: [aspirra-network]

  assessment-service:
    build: { context: ./src/Services/AssessmentService, dockerfile: Dockerfile }
    container_name: aspirra-assessment-service
