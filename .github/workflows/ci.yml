name: CI - Build, Test and Push to GHCR

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/aiu-softwave/aspirra

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Aspirra.slnx

      - name: Build
        run: dotnet build Aspirra.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Aspirra.slnx --no-build --configuration Release --logger "console;verbosity=normal"

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: student-service
            context: ./src/Services/StudentService
          - service: academic-service
            context: ./src/Services/AcademicService
          - service: course-service
            context: ./src/Services/CourseService
          - service: assessment-service
            context: ./src/Services/AssessmentService
          - service: goal-planner-service
            context: ./src/Services/GoalPlannerService
          - service: habit-service
            context: ./src/Services/HabitService

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
